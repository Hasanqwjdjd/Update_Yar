name: Build APK (آپدیت‌یار)

# این workflow فایل APK اپلیکیشن آفلاین را روی سرورهای گیت‌هاب می‌سازد
# بدون نیاز به نصب Android Studio روی سیستم شما!

on:
  # اجرای دستی از تب Actions (دکمه Run workflow)
  workflow_dispatch:
  # اجرای خودکار وقتی فایل‌های اپ تغییر کنند
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'next.config.ts'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: ساخت APK
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد از مخزن
        uses: actions/checkout@v4

      - name: نصب Bun
        uses: oven-sh/setup-bun@v2

      - name: نصب وابستگی‌های Node
        run: bun install --frozen-lockfile

      - name: ساخت نسخه استاتیک اپ (کاملاً آفلاین)
        run: bun run build

      - name: انتقال اپ به پروژه اندروید
        run: npx cap sync android

      - name: نصب Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: دسترسی اجرایی به gradlew
        run: chmod +x android/gradlew

      - name: ساخت APK دیباگ (قابل نصب روی هر گوشی)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: ساخت APK نهایی امضادار (Release — برای انتشار در کافه‌بازار/مایکت)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: آپلود هر دو APK به عنوان خروجی (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: updatayar-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
          if-no-files-found: error
