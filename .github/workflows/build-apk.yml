name: Build APK (آپدیت‌یار)

# ساخت APK آفلاین روی سرورهای گیت‌هاب — بدون نیاز به Android Studio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'next.config.ts'
      - 'package.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: ساخت APK
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد از مخزن
        uses: actions/checkout@v4

      - name: نصب Bun
        uses: oven-sh/setup-bun@v2

      - name: نصب وابستگی‌ها
        run: bun install --frozen-lockfile

      # چک TypeScript — با ignoreBuildErrors=false هر خطای تایپ بیلد را می‌شکند
      # تا باگ‌هایی مثل import گمشده (عامل کرش قبلی) هرگز به APK نرسند
      - name: چک TypeScript
        run: bunx tsc --noEmit

      - name: ساخت نسخه استاتیک اپ (کاملاً آفلاین)
        run: bun run build

      - name: انتقال اپ به پروژه اندروید
        run: npx cap sync android

      - name: نصب Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: دسترسی اجرایی به gradlew
        run: chmod +x android/gradlew

      - name: ساخت APK دیباگ
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: ساخت APK نهایی امضادار (Release)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: آپلود هر دو APK
        uses: actions/upload-artifact@v4
        with:
          name: updatayar-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
